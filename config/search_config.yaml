# Miraflores Rental Intelligence — search configuration
# Change criteria here; no code edits needed. Every value is read by src/config.py.

location:
  country: Peru
  city: Lima
  district: Miraflores
  # Bounding box used for OSM queries and as a coarse sanity check (south, west, north, east).
  # Slightly larger than the district so that roads/bars just across the border are counted.
  bbox: [-12.1420, -77.0620, -12.0960, -77.0000]
  # Text tokens that indicate a *different* district even if "Miraflores" appears
  # (e.g. "San Juan de Miraflores" is a different district in southern Lima).
  exclude_district_tokens:
    - "san juan de miraflores"
    - "miraflores, arequipa"
    - "arequipa"

transaction: rent
property_type: apartment

budget:
  currency: USD
  target_max_rent: 1000        # principal budget (base rent)
  target_max_total: 1000       # preferred ceiling for rent + maintenance
  # A BASE_RENT_COMPLIANT unit (total unknown or > 1,000) must beat a STRICT_ALL_IN unit by more than
  # this many fit points to be ranked above it.
  strict_preference_margin: 5
  stretch_max_rent: 1100       # 1,001–1,100 → STRETCH_NEGOTIABLE sheet only
  # Up to this % above the stretch ceiling (1% = USD 11, typically an FX-conversion effect) → BORDERLINE:
  # shown on the NEAR_MISSES sheet, never budget-compliant, never in the shortlist.
  borderline_max_over_pct: 1.0
  # Portal-side price ceiling. Slightly above stretch so PEN-priced listings converted by
  # the portal at a different rate are not lost. Every record is re-validated after extraction.
  query_max_rent: 1150

bedrooms:
  min: 1
  max: 2
  allow_studios: false         # studios excluded unless listing explicitly says 1 dormitorio

occupants: couple

preferences:
  quietness: very_high
  space: high
  furnished: preferred         # desirable, NOT a hard requirement
  parking: optional
  balcony: preferred
  natural_light: preferred
  security: preferred
  laundry: preferred

# Space bands (m², analytical guidance only).
space_bands:
  1:
    small_below: 40
    acceptable_from: 40
    good_from: 50
    very_spacious_from: 60
  2:
    small_below: 55
    acceptable_from: 55
    good_from: 70
    very_spacious_from: 85

scoring:
  quietness: 25
  budget: 20
  space: 20
  location: 10
  furnishing: 8
  building: 7
  listing_quality: 10

noise_model:
  baseline: 72
  major_road:            # OSM highway = motorway / trunk / primary (+ _link)
    strong_m: 50
    strong_penalty: 30
    moderate_m: 150
    moderate_penalty: 15
    mild_m: 300
    mild_penalty: 6
  arterial_road:         # OSM highway = secondary
    strong_m: 30
    strong_penalty: 14
    moderate_m: 100
    moderate_penalty: 6
  nightclub:
    strong_m: 150
    strong_penalty: 25
    moderate_m: 300
    moderate_penalty: 12
    mild_m: 500
    mild_penalty: 4
  bar_cluster:           # amenity = bar / pub within radius
    radius_m: 150
    many_threshold: 3
    many_penalty: 12
    few_penalty: 5
  restaurant_cluster:
    radius_m: 150
    threshold: 10
    penalty: 5
  text_signals:
    interior_view: 10
    acoustic_windows: 12
    quiet_street_claim: 3      # seller claim — weak evidence
    avenue_view: -12
    high_floor_min: 8
    high_floor_bonus: 3
  risk_thresholds:
    low_from: 70
    medium_from: 50

livability:                      # metres; used for the 10-pt LOCATION component
  supermarket_m: 500
  pharmacy_m: 400
  park_m: 300
  cafe_m: 300
  transit_m: 400
  malecon_m: 900

value_analysis:
  min_group_size: 5              # below this, value band = INSUFFICIENT_SAMPLE

red_flags:
  very_high_deposit_months: 3
  long_min_contract_months: 13   # > 12 months is flagged
  very_small_area_factor: 0.85   # area < factor × "small" band threshold

near_misses:
  max_distance_outside_m: 300    # only just across the border
  min_fit_score: 70

dedupe:
  coord_match_m: 40
  price_tolerance: 0.05
  area_tolerance: 0.06
  title_ratio: 85
  description_ratio: 80
  match_threshold: 0.60

qa:
  top_n_programmatic: 30
  top_n_deep: 10
  request_delay_s: 3.0

shortlist:
  top_n: 10
  alternatives_max: 20

cost_control:
  # PROJECT-WIDE hard ceiling for paid scraping — all pipeline runs together, not per run. Spend already
  # made is read back from Apify's own run records (every run of the project's actors since
  # project_start_utc) before any new paid call; if that history cannot be read, paid calls are blocked.
  max_external_usd: 5.00
  project_start_utc: "2026-09-24T00:00:00Z"
  # Assumed cost of a run whose pricing cannot be parsed — an unknown cost is never treated as zero.
  unknown_pricing_run_usd: 0.50
  validation_items_per_segment: 5  # Gate 2: records per bedroom segment per portal
  # Records one Actor run can return on the current Apify plan (FREE: 10, per the actors' docs). Runs never
  # request more, so each run's worst-case price and Apify-side ceiling stay tight. To collect more on this
  # plan add start URLs (e.g. result pages) to a segment — each URL is its own run. Raise only after an
  # Apify plan upgrade.
  apify_max_items_per_run: 10
  full_budget_share: 0.85        # fraction of the remaining budget the full run may commit (rest = QA re-checks)
  target_valid_unique: 30        # stop scaling up once this many valid unique candidates are expected

sources:
  # Collection is stratified by bedroom count: one Actor run per segment (and per start URL), so one
  # segment can never consume the other's results. The free Apify plan caps every run at 10 records
  # and returns list-level data only (no detail pages); see SOURCE_AUDIT.md.
  urbania:
    enabled: true
    method: apify
    actor_id: scrapers_lat/urbania-scraper
    full_max_items_per_segment: 80   # upper bound; the run budget scales it down (see cost_control)
    # Portal-side filters use Urbania's own URL grammar (verified in its search index, Sep 2026):
    # bedroomsNumber, priceMax, currencyId=2 (USD). Every record is re-validated after extraction.
    segments:
      - bedrooms: 1
        start_urls:
          - https://urbania.pe/buscar/alquiler-de-departamentos-en-miraflores--lima--lima?bedroomsNumber=1&priceMax=1150&currencyId=2
      - bedrooms: 2
        start_urls:
          - https://urbania.pe/buscar/alquiler-de-departamentos-en-miraflores--lima--lima?bedroomsNumber=2&priceMax=1150&currencyId=2
    base_url: https://urbania.pe

  adondevivir:
    enabled: true
    method: apify
    actor_id: scrapers_lat/adondevivir-scraper
    full_max_items_per_segment: 60
    # Bedroom-filtered pages (verified in the search index); price filtered by actor input.
    segments:
      - bedrooms: 1
        start_urls:
          - https://www.adondevivir.com/departamentos-en-alquiler-en-miraflores-con-1-dormitorio.html
      - bedrooms: 2
        start_urls:
          - https://www.adondevivir.com/departamentos-en-alquiler-en-miraflores-con-2-dormitorios.html
    base_url: https://www.adondevivir.com

  mercadolibre:
    enabled: true
    method: direct_html
    search_url: https://inmuebles.mercadolibre.com.pe/departamentos/alquiler/lima/miraflores/
    max_pages: 8                  # 48 results/page
    fetch_details: true
    max_details: 120
    request_delay_s: 2.5

  manual:
    enabled: true
    method: file_import
    # Drop CSV/JSON files exported by hand (other portals, agencies) into this folder.
    directory: data/manual

fx:
  # Primary: BCRP daily interbank sell rate (series PD04640PD). Fetched at run time.
  bcrp_series: PD04640PD
  # Flag CURRENCY_CONVERSION_MISMATCH when a portal's own USD figure differs from PEN ÷ this run's rate
  # by more than this many percent (both published figures are kept; ranking uses the normalised one).
  published_mismatch_flag_pct: 5
  # Fallback used ONLY if the live fetch fails. Documented in RUN_LOG.md when used.
  fallback:
    usd_pen: 3.385
    source: "SUNAT tipo de cambio venta 24-Sep-2026 (as reported by La República / América TV, obtained via web search)"
    timestamp: "2026-09-24T12:00:00-05:00"

http:
  user_agent: "MirafloresRentalResearch/1.0 (personal apartment search; low-volume, polite)"
  timeout_s: 30
  min_delay_s: 2.0
